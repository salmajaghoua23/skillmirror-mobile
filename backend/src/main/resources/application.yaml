server:
  port: 8080

spring:
  application:
    name: skillmirror-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # les tables existent déjà dans Supabase

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS}
