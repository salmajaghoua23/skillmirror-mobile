server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: skillmirror-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # les tables existent déjà dans Supabase

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS}
supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}   # clé service_role (jamais dans Flutter)
  cv-bucket: candidate_cvs                          # nom de ton bucket Storage

ollama:
  url: http://localhost:11434
  model: llama3.2:1b
  timeout-seconds: 240
  enabled: false